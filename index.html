<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webzy.Tech</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>

    <!-- Main Container -->
    <div class="main-container">
        <header class="hero">
            <h1>WEB APP DEVELOPMENT</h1>
            <p>Modern & Futuristic Web App Solutions</p>
        </header>

        <!-- Dashboard UI -->
        <div class="dashboard">
            <div class="circle large">UI</div>
            <div class="circle small">UX</div>
            <div class="circle small">Design</div>
            <div class="circle small">Tools</div>

            <div class="glass-panel">
                <h2>Our Services</h2>
                <div class="services">
    <div class="service-card">
        <i class="fas fa-laptop-code"></i> Custom Apps
    </div>
    <div class="service-card">
        <i class="fas fa-paint-brush"></i> UI/UX Design
    </div>
    <div class="service-card">
        <i class="fas fa-cogs"></i> API Integration
    </div>
</div>

            <div class="glass-panel">
                <h2>Portfolio</h2>
                <div class="portfolio-grid">
                    <div class="portfolio-item"></div>
                    <div class="portfolio-item"></div>
                    <div class="portfolio-item"></div>
                </div>
            </div>

            <div class="glass-panel">
                <h2>Contact Us</h2>
                <form>
                    <input type="text" placeholder="Your Name" required>
                    <input type="email" placeholder="Your Email" required>
                    <textarea placeholder="Your Message"></textarea>
                    <button type="submit" class="btn">Send</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
